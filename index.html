<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Game</title>
  <link rel="stylesheet" href="src/style.css">
  <!-- Collects page errors so the Helper can check the preview tab in one call (docs/agents/environment.md). Keep it. -->
  <script>window.pageErrors = []; addEventListener('error', (e) => pageErrors.push(String(e.message))); addEventListener('unhandledrejection', (e) => pageErrors.push(String(e.reason)));</script>
  <!-- three.js is available to any module via `import * as THREE from 'three'`. Pinned version, no build step (see docs/adr/0002). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <main id="title-screen" class="screen">
    <h1 class="title">? ? ?</h1>
    <p class="subtitle">Ett nytt spel är på väg… <span class="en">A new game is on its way…</span></p>
    <button id="play" class="big-button">▶ SPELA · PLAY</button>
  </main>

  <main id="design-screen" class="screen hidden">
    <div class="pencil">✏️</div>
    <h2>Dags att designa!</h2>
    <p>Berätta för din hjälpare vad spelet ska handla om.</p>
    <p class="en">Time to design! Tell your helper what the game should be about.</p>
    <button id="back" class="small-button">⏪</button>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
