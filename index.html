<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooftop Rescue</title>
  <link rel="stylesheet" href="src/style.css">
  <!-- three.js is available to any module via `import * as THREE from 'three'`. Pinned version, no build step (see docs/adr/0002). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage" tabindex="0"></canvas>
  <div id="fx-layer"></div>

  <div id="hud" class="hidden">
    <div class="hud-box">RESCUED: <span id="rescued">0</span></div>
    <div class="hud-box timer">⏱ <span id="timer">90</span></div>
  </div>

  <main id="title-screen" class="screen">
    <h1 class="title">ROOFTOP<br>RESCUE</h1>
    <div class="how">
      <p>⬆️ ⬅️ ➡️ ⬇️ fly &nbsp;·&nbsp; SPACE web-swing &nbsp;·&nbsp; rescue people!</p>
      <p class="en">Piltangenter: flyg · Mellanslag: nät-sving · Rädda folk!</p>
    </div>
    <button id="play" class="big-button">▶ SPELA · PLAY</button>
  </main>

  <main id="end-screen" class="screen hidden">
    <div class="big-heart">💖</div>
    <h2 id="end-score">You rescued 0 people!</h2>
    <p>The whole town says THANK YOU!</p>
    <button id="play-again" class="big-button">↻ PLAY AGAIN</button>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
