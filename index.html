<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Punch</title>
  <link rel="stylesheet" href="src/style.css">
  <!-- Collects page errors so the Helper can check the preview tab in one call (docs/agents/environment.md). Keep it. -->
  <script>window.pageErrors = []; addEventListener('error', (e) => pageErrors.push(String(e.message))); addEventListener('unhandledrejection', (e) => pageErrors.push(String(e.reason)));</script>
  <!-- three.js is available to any module via `import * as THREE from 'three'`. Pinned version, no build step (see docs/adr/0002). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <main id="title-screen" class="screen">
    <div class="panel">
      <h1 class="title">ROCKET PUNCH!</h1>
      <p class="subtitle">Slå mot kameran så flyger handsken! <span class="en">Punch at the camera and your glove flies!</span></p>
      <p class="keys"></p>
      <button id="play" class="big-button">👯 2 SPELARE · 2 PLAYERS</button>
      <p class="sides"><span class="p1">⬅️ P1 TEAL</span> stand side by side <span class="p2">P2 ORANGE ➡️</span></p>
      <button id="play-1p" class="small-button">🥊 1 SPELARE · 1 PLAYER</button>
    </div>
  </main>

  <main id="camera-screen" class="screen hidden">
    <div class="panel">
      <div class="big-icon">📷</div>
      <h2>Tillåt kameran! <span class="en">Allow the camera!</span></h2>
      <p>Click <b>Allow</b> at the top of the window.</p>
      <button id="skip-camera" class="small-button">⌨️ Play with keys instead</button>
    </div>
  </main>

  <main id="camera-failed-screen" class="screen hidden">
    <div class="panel">
      <div class="big-icon">🙈</div>
      <h2>No camera this time</h2>
      <p id="camera-trouble"></p>
      <p class="keys"></p>
      <button id="play-keys" class="big-button">▶ PLAY WITH KEYS</button>
    </div>
  </main>

  <main id="win-screen" class="screen hidden">
    <div class="panel">
      <h1 id="win-title" class="title win">YOU WIN! ⭐</h1>
      <p id="win-sub" class="subtitle">Du vann! <span class="en">What a rocket punch!</span></p>
      <button id="again-win" class="big-button">🔁 SPELA IGEN · PLAY AGAIN</button>
      <button id="menu" class="small-button">🏠 1 / 2 PLAYERS</button>
    </div>
  </main>

  <main id="timeup-screen" class="screen hidden">
    <div class="panel">
      <h1 class="title">TIME! ⏰</h1>
      <p id="time-hits" class="subtitle"></p>
      <button id="again-time" class="big-button">🔁 SPELA IGEN · PLAY AGAIN</button>
      <button id="menu-time" class="small-button">🏠 1 / 2 PLAYERS</button>
    </div>
  </main>

  <p id="hint" class="hint hidden"></p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
